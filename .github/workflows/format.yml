name: format

on:
  push:
    branches: [main, demo-updates]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pin black so CI matches the version the repo was formatted with.
      - name: Install formatters
        run: python -m pip install --upgrade "black==26.5.1" "nbformat>=5.9"

      # black formats all Python sources (config in pyproject.toml, line-length 100).
      - name: black (check .py)
        run: black --check --diff src scripts

      # nbformat validates every notebook is well-formed v4 JSON.
      - name: nbformat validate (.ipynb)
        run: |
          python - <<'PY'
          import glob, nbformat
          nbs = [p for p in glob.glob("**/*.ipynb", recursive=True)
                 if ".venv" not in p and "qBraid" not in p]
          assert nbs, "no notebooks found"
          for p in sorted(nbs):
              nbformat.validate(nbformat.read(p, as_version=4))
              print("valid:", p)
          PY
